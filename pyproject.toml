[project]
name = "shopper-buddy"
version = "0.1.0"
description = "AI grocery shopping assistant exposed as an MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "kroger", "trends", "models", "db", "auth_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
